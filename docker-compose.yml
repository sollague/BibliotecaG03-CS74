services:
  db:
    image: mysql:8.0
    container_name: biblioteca_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: biblioteca_g03
      MYSQL_USER: biblioteca
      MYSQL_PASSWORD: biblioteca123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/biblioteca_g03.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: biblioteca_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: "mysql://root:rootpassword@db:3306/biblioteca_g03"
      JWT_SECRET: "clave_secreta_de_desarrollo_al_menos_32_caracteres_12345"
      JWT_EXPIRES_IN: "8h"
      COOKIE_NAME: "bg03_token"
      FRONTEND_URL: "http://localhost:5173"
      ADMIN_EMAIL: "admin@biblioteca.ug.edu.ec"
      ADMIN_PASSWORD: "Admin12345*"
      RUN_MIGRATIONS: "true"
      RUN_SEED: "true"
    command: node --watch src/server.js
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - uploads_data:/app/uploads
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: biblioteca_frontend
    restart: unless-stopped
    environment:
      BACKEND_PROXY_URL: "http://backend:4000"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads_data:
